name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '31 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard analyses public repositories only — on a private one its GraphQL queries come
    # back "Resource not accessible by integration" and the job fails for a reason that has
    # nothing to do with the code. This repository starts private and is flipped to public
    # later, so gate on visibility rather than leaving a permanently red workflow. Also skip
    # the scheduled run on forks, which cannot publish results.
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name != 'schedule' || github.repository_owner == 'randomuzbek')
    permissions:
      security-events: write   # upload the SARIF result to code scanning
      id-token: write          # publish results to the Scorecard API
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
