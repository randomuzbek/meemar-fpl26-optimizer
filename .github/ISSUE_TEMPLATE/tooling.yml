name: Bug in tools/
description: pack.py or harness_timeline.py misbehaves.
labels: [tooling]
body:
  - type: markdown
    attributes:
      value: >-
        These two tools are meant to be useful to other contest entrants, so bugs in them are
        worth fixing. Note that `submission/` is frozen and cannot be changed — see
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - tools/pack.py
        - tools/harness_timeline.py
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the output or traceback.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS, Python version, git version
      placeholder: Ubuntu 24.04, Python 3.12.4, git 2.45
    validations:
      required: true
